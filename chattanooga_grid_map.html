// OpenStreetMap writes voltage in volts, like "161000;46000". Return the highest one in kV.
function topKv(text) {
  const values = text.split(";").map(v => v.trim()).filter(v => /^\d+$/.test(v)).map(Number);
  return values.length ? Math.max(...values) / 1000 : null;
}
function lineStyle(kv) {
  if (kv === null) return UNKNOWN;
  const found = VOLTAGE_CLASSES.find(c => kv < c[0]);
  return [found[1], found[2], found[3]];
}
function operatorGroup(name) {
  if (/EPB|Electric Power Board/.test(name)) return "EPB";
  if (/TVA|Tennessee Valley/.test(name)) return "TVA";
  return "Other or not listed";
}
function kvText(text) {
  const values = text.split(";").map(v => v.trim()).filter(v => /^\d+$/.test(v)).map(v => Number(v) / 1000 + " kV");
  return values.length ? values.join(", ") : "not listed";
}

// ---------- 3. Map ----------
const [south, west, north, east] = SNAPSHOT.bbox;
const map = L.map("map").setView([(south + north) / 2, (west + east) / 2], 12);
// Fit the whole snapshot once the page has its real size.
window.addEventListener("load", () => { map.invalidateSize(); map.fitBounds([[south, west], [north, east]]); });

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, opacity: 0.75,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
}).addTo(map);

// Power lines, low voltage first so the big lines end up on top.
const lineLayer = L.layerGroup().addTo(map);
[...SNAPSHOT.lines].sort((a, b) => (topKv(a.voltage) || 0) - (topKv(b.voltage) || 0)).forEach(line => {
  const [color, weight] = lineStyle(topKv(line.voltage));
  L.polyline(line.coords.map(p => [p[1], p[0]]), { color, weight, opacity: 0.9 })
    .bindPopup("Power line<br>Voltage: " + kvText(line.voltage))
    .addTo(lineLayer);
});

// Substations.
const substationLayer = L.layerGroup().addTo(map);
SNAPSHOT.substations.forEach(sub => {
  const group = operatorGroup(sub.operator);
  L.circleMarker([sub.lat, sub.lon], { radius: 6, color: "#ffffff", weight: 1.5, fillColor: OPERATOR_COLORS[group], fillOpacity: 1 })
    .bindPopup("<b>" + (sub.name || "Substation (no name listed)") + "</b><br>Operator: " + (sub.operator || "not listed") + "<br>Voltage: " + kvText(sub.voltage))
    .addTo(substationLayer);
});

// Our proposed design.
const designLayer = L.layerGroup().addTo(map);
DESIGN_LINKS.forEach(link => {
  const style = LINK_STYLES[link.protection];
  L.polyline([DESIGN_SITES[link.from], DESIGN_SITES[link.to]], { color: style.color, weight: style.weight, dashArray: "10 6" })
    .bindPopup(style.label + "<br>" + link.from + " to " + link.to + "<br><br><b>Why:</b> " + link.why + "<br><br>Straight line for illustration. Not a fiber route.")
    .addTo(designLayer);
});
Object.entries(DESIGN_SITES).forEach(([name, position]) => {
  L.circleMarker(position, { radius: 9, color: "#ffffff", weight: 2, fillColor: "#111111", fillOpacity: 1 })
    .bindPopup("<b>" + name + "</b><br>Placeholder location. Not a real EPB site.")
    .bindTooltip(name, { permanent: true, direction: "right", offset: [10, 0], className: "site-label" })
    .addTo(designLayer);
});

L.control.layers(null, {
  "Power lines (public data)": lineLayer,
  "Substations (public data)": substationLayer,
  "Our proposed design": designLayer,
}, { collapsed: false }).addTo(map);
L.control.scale().addTo(map);

// Title and legend.
const legend = L.control({ position: "bottomleft" });
legend.onAdd = function () {
  const box = L.DomUtil.create("div", "panel");
  let text = "<h1>Chattanooga grid map</h1>";
  text += "<p>Public OpenStreetMap snapshot from " + SNAPSHOT.osm_time.slice(0, 10) + ". Incomplete. It does not show fiber routes.</p>";
  text += "<h2>Power lines</h2>";
  VOLTAGE_CLASSES.forEach(c => { text += '<span class="swatch" style="border-top-width:' + (c[2] + 1) + 'px;border-top-color:' + c[1] + '"></span>' + c[3] + "<br>"; });
  text += '<span class="swatch" style="border-top-width:2px;border-top-color:' + UNKNOWN[0] + '"></span>' + UNKNOWN[2] + "<br>";
  text += "<h2>Substations</h2>";
  Object.entries(OPERATOR_COLORS).forEach(([name, color]) => { text += '<span class="square" style="background:' + color + ';border-radius:50%"></span>' + name + "<br>"; });
  text += "<h2>Our proposed design (placeholder locations)</h2>";
  Object.values(LINK_STYLES).forEach(s => { text += '<span class="swatch" style="border-top-width:4px;border-top-style:dashed;border-top-color:' + s.color + '"></span>' + s.label.replace("Proposed: ", "") + "<br>"; });
  box.innerHTML = text;
  L.DomEvent.disableClickPropagation(box);
  return box;
};
legend.addTo(map);
</script>
</body>
</html>
